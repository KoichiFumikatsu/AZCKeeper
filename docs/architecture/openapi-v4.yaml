    PolicyRuleSource:
      type: object
      additionalProperties: false
      required:
      - rule
      - scope
      - assignment_ids
      properties:
        rule:
          $ref: '#/components/schemas/Rule'
        scope:
          type: string
          enum:
          - global
          - tenant
          - site
          - area
          - user
          - device
        assignment_ids:
          type: array
          items:
            type: string
            format: uuid
    UserEffectivePolicies:
      type: object
      additionalProperties: false
      required:
      - user_id
      - devices
      properties:
        user_id:
          type: string
          format: uuid
        devices:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - device_id
            - policy
            - rules
            properties:
              device_id:
                anyOf:
                - type: string
                  format: uuid
                - type: 'null'
              policy:
                $ref: '#/components/schemas/ResolvedUserPolicy'
              rules:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyRuleSource'
    ResolvedUserPolicy:
      type: object
      additionalProperties: false
      required:
      - tenant_id
      - device_id
      - rules
      - schedules
      - composition
      - management_hosts
      properties:
        tenant_id:
          type: string
          format: uuid
        device_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
          maxItems: 1000
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'
          maxItems: 100
        composition:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - level
            - revision
            properties:
              level:
                type: string
                enum:
                - platform
                - tenant
                - site
                - area
                - user
                - device
              revision:
                type: string
                maxLength: 100
          maxItems: 30
        management_hosts:
          type: array
          items:
            type: string
            maxLength: 255
          maxItems: 30
      description: Composicion actual resuelta, sin persistir una nueva version de equipo.
    MigrationAuthorizationInput:
      type: object
      additionalProperties: false
      required:
      - device_id
      - public_key_thumbprint
      - expires_in
      properties:
        device_id:
          type: string
          format: uuid
        public_key_thumbprint:
          type: string
          pattern: ^[a-f0-9]{64}$
        expires_in:
          type: integer
          minimum: 60
          maximum: 600
    MigrationAuthorization:
      type: object
      additionalProperties: false
      required:
      - token
      - device_id
      - tenant_id
      - expires_at
      properties:
        token:
          type: string
        device_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
    MigrationTokenInput:
      type: object
      additionalProperties: false
      required:
      - device_id
      - token
      properties:
        device_id:
          type: string
          format: uuid
        token:
          type: string
          minLength: 43
          maxLength: 43
    MigrationTokenValidation:
      type: object
      additionalProperties: false
      required:
      - valid
      - device_id
      - expires_at
      properties:
        valid:
          type: boolean
        device_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
    EscrowKey:
      type: object
      additionalProperties: false
      required:
      - key_id
      - algorithm
      - public_key
      properties:
        key_id:
          type: string
        algorithm:
          type: string
          enum:
          - crypto_box_seal
        public_key:
          type: string
    EscrowInput:
      type: object
      additionalProperties: false
      required:
      - tenant_id
      - device_id
      - account_sid
      - revision
      - key_id
      - envelope
      properties:
        tenant_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        account_sid:
          type: string
          pattern: ^S-1-5-21-[0-9]+-[0-9]+-[0-9]+-[0-9]+$
          maxLength: 184
        revision:
          type: integer
          minimum: 1
        key_id:
          type: string
          maxLength: 64
        envelope:
          type: string
          minLength: 64
          maxLength: 8192
    EscrowAck:
      type: object
      additionalProperties: false
      required:
      - persisted
      - escrow_id
      - revision
      - sha256
      - persisted_at
      properties:
        persisted:
          const: true
        escrow_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        persisted_at:
          type: string
          format: date-time
    EscrowVerifyInput:
      type: object
      additionalProperties: false
      required:
      - revision
      - sha256
      properties:
        revision:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
    EscrowVerified:
      type: object
      additionalProperties: false
      required:
      - recoverable
      - revision
      - sha256
      - verified_at
      properties:
        recoverable:
          const: true
        revision:
          type: integer
          minimum: 0
        sha256:
          type: string
        verified_at:
          type: string
          format: date-time
    EscrowRecoveryInput:
      type: object
      additionalProperties: false
      required:
      - revision
      - reason
      properties:
        revision:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 8
          maxLength: 500
    EscrowRecovery:
      type: object
      additionalProperties: false
      required:
      - account_sid
      - revision
      - password
      - audit_id
      properties:
        account_sid:
          type: string
        revision:
          type: integer
          minimum: 0
        password:
          type: string
        audit_id:
          type: string
          format: uuid
    MigrationStateInput:
      type: object
      additionalProperties: false
      required:
      - phase
      - revision
      properties:
        phase:
          type: string
          enum:
          - instalado
          - enrolado
          - escrow_ok
          - degradado
          - pendiente_reinicio
          - completo
          - excepcion
        revision:
          type: integer
          minimum: 1
        standard_user_verified:
          type: boolean
        code:
          type: string
          pattern: ^[a-zA-Z0-9_.-]{1,80}$
    MigrationState:
      type: object
      additionalProperties: false
      required:
      - device_id
      - phase
      - revision
      - escrow_revision
      - updated_at
      properties:
        device_id:
          type: string
          format: uuid
        phase:
          anyOf:
          - type: string
            enum:
            - instalado
            - enrolado
            - escrow_ok
            - degradado
            - pendiente_reinicio
            - completo
            - excepcion
          - type: 'null'
        revision:
          type: integer
          minimum: 0
        escrow_revision:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-keeper_admin
      description: Secure/HttpOnly/SameSite=Strict/Path=/; idle 30 min, absoluto 8 h. Mutaciones requieren CSRF.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Synchronizer token de sesión/pre-sesión; no autentica por sí solo.
    deviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: TTL 1 h, ligado a tenant/device/membresía/clave. Requiere firma HTTP.
    deviceSignature:
      type: apiKey
      in: header
      name: Signature
      description: RFC 9421; tipo apiKey solo describe header, no es una API key. Requiere Signature-Input y clave
        registrada o ligada al ticket.
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Credencial por integración de un tenant; x-required-scopes se valida también para API key. Expirable/revocable
        y almacenada como hash.
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /v1/oauth/token
          scopes:
            dashboard:read: KPIs y gráficas de empresa.
            team:read: Lista y ranking de miembros.
            members:read: Perfil mínimo y dashboard por miembro.
            devices:read: Equipos/specs sin secretos.
            activity:read: Actividad sin títulos.
            activity-titles:read: Títulos; además exige activity:read.
            productivity:read: Series de productividad/focus.
            presence:read: Check-in sin GPS.
            location:read: GPS; además exige presence:read.
            tiers:read: Tiers y suscripción.
            organization:read: Sedes, firmas, áreas y cargos.
            notifications:read: Feed saneado.
      description: Cliente de un tenant, token 15 min, aud=keeper-external-v1. Solo servidor-servidor.
    oauthClient:
      type: http
      scheme: basic
      description: client_secret_basic para token endpoint.
    preLoginSession:
      type: apiKey
      in: cookie
      name: __Host-keeper_prelogin
      description: Pre-sesión de login, TTL 5 min, Secure/HttpOnly/SameSite=Strict/Path=/; ligada al csrfToken.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Code:
      name: code
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
    Tenant:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Selección admin explícita y autorizada; prohibida en cliente/externa.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 1024
      description: Firmado y ligado a tenant, autorización, filtros, orden/snapshot; TTL 15 min.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    From:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date
      description: Inclusivo, timezone del tenant.
    To:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date
      description: Exclusivo. Máximo 31 días detalle/dashboard, 366 en productivity.
    Area:
      name: area_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    Site:
      name: site_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    User:
      name: user_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    Status:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
        - active
        - inactive
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        maxLength: 160
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 160
      description: 428 ausente; 412 obsoleto.
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 24 h por tenant+principal+ruta; cuerpo distinto con misma clave=409.
    SignatureInput:
      name: Signature-Input
      in: header
      required: true
      schema:
        type: string
        maxLength: 4096
      description: RFC 9421 sig1, ecdsa-p256-sha256, created/expires <=60 s, nonce/keyid. Perfil v4-api.md §3.2.
    ContentDigest:
      name: Content-Digest
      in: header
      required: true
      schema:
        type: string
        maxLength: 100
      description: SHA-256 del cuerpo exacto RFC 9530; header cubierto por firma.
    Titles:
      name: include_titles
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Exige permiso/scope adicional explícito.
    Location:
      name: include_location
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Exige permiso/scope adicional explícito.
  headers:
    X-Request-ID:
      schema:
        type: string
        format: uuid
      description: Trazabilidad generada por servidor.
    RateLimit-Limit:
      schema:
        type: integer
        minimum: 0
      description: Capacidad/min del bucket más restrictivo.
    RateLimit-Remaining:
      schema:
        type: integer
        minimum: 0
      description: Unidades disponibles en ese bucket.
    RateLimit-Reset:
      schema:
        type: integer
        minimum: 0
      description: Segundos hasta reposición del bucket.
    X-RateLimit-Scope:
      schema:
        type: string
        enum:
        - device
        - tenant
        - integration
        - admin
        - bootstrap
      description: Bucket reportado, sin exponer credenciales.
  responses:
    BadRequest:
      description: JSON/cabeceras inválidos.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        X-RateLimit-Scope:
          $ref: '#/components/headers/X-RateLimit-Scope'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Credencial/firma/sesión inválida o expirada; no rate limit.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        X-RateLimit-Scope:
          $ref: '#/components/headers/X-RateLimit-Scope'
        WWW-Authenticate:
          schema:
            type: string
            maxLength: 256
          description: Desafío según superficie; admin usa code session_expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Permiso/scope/gate/CSRF insuficiente.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        X-RateLimit-Scope:
          $ref: '#/components/headers/X-RateLimit-Scope'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No existe dentro del ámbito; incluye objeto de otro tenant.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        X-RateLimit-Scope:
          $ref: '#/components/headers/X-RateLimit-Scope'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicto de idempotencia/asignación/transición.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        X-RateLimit-Scope:
          $ref: '#/components/headers/X-RateLimit-Scope'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: ETag obsoleto.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        X-RateLimit-Scope:
          $ref: '#/components/headers/X-RateLimit-Scope'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Excede límite de bytes descomprimidos.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        X-RateLimit-Scope:
          $ref: '#/components/headers/X-RateLimit-Scope'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Content-Type/Encoding no permitido.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        X-RateLimit-Scope:
          $ref: '#/components/headers/X-RateLimit-Scope'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Campos, rango o referencias inválidos.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        X-RateLimit-Scope:
          $ref: '#/components/headers/X-RateLimit-Scope'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: Falta If-Match.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        X-RateLimit-Scope:
          $ref: '#/components/headers/X-RateLimit-Scope'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
