openapi: 3.1.1
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: AZCKeeper v4 — contrato API
  version: 1.0.0-draft
  description: Producto v4, contrato HTTP v1. Superficies de agente, consulta externa y administración. Las rutas
    implementadas se publican en backend-v4/config/contract.json; incluye presencia, calendario, cumplimiento y
    operación de fase B. Semántica normativa adicional en v4-api.md.
servers:
- url: /v1
  description: Origen HTTPS del despliegue; agente y administración.
security: []
tags:
- name: client
- name: admin
- name: auth
- name: external
paths:
  /client/hardening:
    get:
      tags:
      - client
      operationId: getClientHardening
      summary: Obtener configuraci?n y clave compartida del tenant
      security:
      - deviceBearer: []
        deviceSignature: []
      x-tenant-boundary: Tenant y dispositivo exclusivamente del token firmado.
      parameters:
      - $ref: '#/components/parameters/SignatureInput'
      responses:
        '200':
          description: Obtener configuraci?n y clave compartida del tenant
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-RateLimit-Scope:
              $ref: '#/components/headers/X-RateLimit-Scope'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientHardeningSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: 409 si no hay clave configurada. Respuesta no-store. El agente debe validar el administrador de
        recuperaci?n antes de degradar al usuario activo, preservar RID-500 y revertir ante fallos. auto permite aplicar
        autom?ticamente; panel espera comando expl?cito. Las barandas locales siguen siendo obligatorias.
  /client/hardening/report:
    post:
      tags:
      - client
      operationId: reportHardening
      summary: Reportar estado observado del endurecimiento
      security:
      - deviceBearer: []
        deviceSignature: []
      x-tenant-boundary: Tenant y dispositivo exclusivamente del token firmado.
      parameters:
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/ContentDigest'
      - $ref: '#/components/parameters/Idempotency'
      responses:
        '200':
          description: Reportar estado observado del endurecimiento
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-RateLimit-Scope:
              $ref: '#/components/headers/X-RateLimit-Scope'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceHardeningStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardeningReport'
      x-max-body-bytes: 8192
      description: Identidad exclusivamente del token, sin selectores tenant/device. Traducir running a pending, unhardened
        a none y fallos sin recuperaci?n a recovery_required. hardened_at se conserva mientras permanezca hardened
        y se limpia al salir; las fechas son del servidor. El diagn?stico debe venir sin secretos.
  /admin/tenants/{id}/hardening:
    get:
      tags:
      - admin
      operationId: getTenantHardening
      summary: Leer configuraci?n con clave enmascarada
      security:
      - adminSession: []
      x-tenant-boundary: Tenant de la ruta/sesi?n; selector concordante. Alcance tenant para configuraci?n y revelado;
        alcance de usuario para dispositivos.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Leer configuraci?n con clave enmascarada
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-RateLimit-Scope:
              $ref: '#/components/headers/X-RateLimit-Scope'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardeningSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-permission: hardening.gestionar
    put:
      tags:
      - admin
      operationId: setTenantHardening
      summary: Configurar endurecimiento y auditar campos modificados
      security:
      - adminSession: []
        csrfToken: []
      x-tenant-boundary: Tenant de la ruta/sesi?n; selector concordante. Alcance tenant para configuraci?n y revelado;
        alcance de usuario para dispositivos.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Configurar endurecimiento y auditar campos modificados
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-RateLimit-Scope:
              $ref: '#/components/headers/X-RateLimit-Scope'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardeningSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-permission: hardening.gestionar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardeningSettingsInput'
      x-max-body-bytes: 8192
  /admin/tenants/{id}/hardening/reveal:
    post:
      tags:
      - admin
      operationId: revealTenantHardening
      summary: Revelar clave compartida y auditar cada acceso
      security:
      - adminSession: []
        csrfToken: []
      x-tenant-boundary: Tenant de la ruta/sesi?n; selector concordante. Alcance tenant para configuraci?n y revelado;
        alcance de usuario para dispositivos.
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Revelar clave compartida y auditar cada acceso
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-RateLimit-Scope:
              $ref: '#/components/headers/X-RateLimit-Scope'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardeningPasswordReveal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-permission: hardening.gestionar
      description: 'Sin cache ni replay de idempotencia: cada revelado exitoso registra hardening.password.reveal
        en la misma transacci?n. Sesi?n, Origin, CSRF y hardening.gestionar con alcance tenant obligatorios.'
  /admin/devices/{id}/hardening:
    get:
      tags:
      - admin
      operationId: getDeviceHardening
      summary: Consultar estado reportado por el dispositivo
      security:
      - adminSession: []
      x-tenant-boundary: Tenant de la ruta/sesi?n; selector concordante. Alcance tenant para configuraci?n y revelado;
        alcance de usuario para dispositivos.
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: Consultar estado reportado por el dispositivo
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-RateLimit-Scope:
              $ref: '#/components/headers/X-RateLimit-Scope'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceHardeningStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-permission: hardening.gestionar
  /admin/devices/{id}/hardening/command:
    post:
      tags:
      - admin
      operationId: createHardeningCommand
      summary: Encolar harden/unharden sin ejecutar cambios en el equipo
      security:
      - adminSession: []
        csrfToken: []
      x-tenant-boundary: Tenant de la ruta/sesi?n; selector concordante. Alcance tenant para configuraci?n y revelado;
        alcance de usuario para dispositivos.
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Idempotency'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '202':
          description: Encolar harden/unharden sin ejecutar cambios en el equipo
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-RateLimit-Scope:
              $ref: '#/components/headers/X-RateLimit-Scope'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardeningCommandAccepted'
      x-permission: hardening.gestionar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardeningCommandInput'
      x-max-body-bytes: 8192
      description: 202 con comando pending, secuencia creciente y TTL 24 horas. Solo equipos activos. harden exige
        clave configurada y rechaza recovery_required; unharden permite recuperaci?n. El comando no contiene la clave
        ni cambia el estado observado; se entrega por /client/commands o /client/sync.
  /client/auth/challenges:
    post:
      tags:
      - client
      operationId: deviceChallenge
      summary: Obtener nonce de un uso, TTL 60 s
      description: Obtener nonce de un uso, TTL 60 s Emitir challenge no invalida otros outstanding. Enrollment_ticket
        desconocido y device_id desconocido devuelven error genérico sin datos de usuario/tenant.
      security: []
      x-tenant-boundary: Ticket o registro; no concede acceso.
      x-resources:
      - Enrollment
      - DeviceKey
      responses:
        '200':
          description: Obtener nonce de un uso, TTL 60 s
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-RateLimit-Scope:
              $ref: '#/components/headers/X-RateLimit-Scope'
            Cache-Control:
              schema:
                const: no-store
              description: No almacenar secretos/sesiones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
      x-max-body-bytes: 4096
  /client/login:
    post:
      tags:
      - client
      operationId: deviceLogin
      summary: Alta, recuperación o renovación con posesión
      description: Nonce de challenge obligatorio; consume ticket y nonce atómicamente. Clave perdida requiere ticket
        de recuperación. GUID nunca basta. La renovación valida la clave de DeviceLogin.public_key contra el registro;
        no puede reemplazarla. Respuesta nunca cambia propietario.
      security:
      - deviceSignature: []
      x-tenant-boundary: Ticket ligado a tenant/user/huella o clave registrada activa.
      x-resources:
      - Enrollment
      - DeviceSession
      responses:
        '200':
          description: Alta, recuperación o renovación con posesión
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-RateLimit-Scope:
              $ref: '#/components/headers/X-RateLimit-Scope'
            Cache-Control:
              schema:
                const: no-store
              description: No almacenar secretos/sesiones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/ContentDigest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceLogin'
      x-max-body-bytes: 8192
  /client/sync:
    post:
      tags:
      - client
      operationId: syncDevice
      summary: Sincronizar con deltas y ACK por registro
      description: Cada 120 s, protocolo 1. Siempre 200 para ACK; policy=null si versión coincide. Token opcional
        solo al renovar. ACK requiere persistencia duradera. Respuesta inline máxima 256 KiB; política mayor se
        recupera una vez por GET si policy_version difiere y policy=null.
      security:
      - deviceBearer: []
        deviceSignature: []
      x-tenant-boundary: Token+clave; dispositivo exacto y membresía activa.
      x-resources:
      - Device
      - Policy
      - Episode
      - ActivitySnapshot
      - Command
      - Release
      - SecurityReport
      - LogEntry
      responses:
        '200':
          description: Sincronizar con deltas y ACK por registro
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-RateLimit-Scope:
              $ref: '#/components/headers/X-RateLimit-Scope'
            Cache-Control:
              schema:
                const: no-store
              description: No almacenar secretos/sesiones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/ContentDigest'
      - $ref: '#/components/parameters/Idempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      x-max-body-bytes: 131072
  /client/policy:
    get:
      tags:
      - client
      operationId: getDevicePolicy
      summary: Leer política condicional
      description: Leer política condicional
      security:
      - deviceBearer: []
        deviceSignature: []
      x-tenant-boundary: Token+clave; dispositivo exacto y membresía activa.
      x-resources:
      - Policy
      - Schedule
      responses:
        '200':
          description: Leer política condicional
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-RateLimit-Scope:
              $ref: '#/components/headers/X-RateLimit-Scope'
            ETag:
              schema:
                type: string
                maxLength: 160
              description: Versión de recurso.
            Cache-Control:
              schema:
                const: private, no-cache
              description: Caché local privada.
            Vary:
              schema:
                const: Authorization
              description: Separar credenciales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectivePolicy'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/SignatureInput'
      - $ref: '#/components/parameters/IfNoneMatch'
  /client/episodes:batch:
    post:
      tags:
      - client
      operationId: ingestEpisodes
      summary: Ingerir backlog con ACK individual
      description: Ingerir backlog con ACK individual
      security:
      - deviceBearer: []
        deviceSignature: []
      x-tenant-boundary: Token+clave; dispositivo exacto y membresía activa.
      x-resources:
      - Episode
      responses:
        '200':
          description: Ingerir backlog con ACK individual
