      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        X-RateLimit-Scope:
          $ref: '#/components/headers/X-RateLimit-Scope'
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Segundos mínimos antes de reintentar.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Dependencia no disponible; sin ACK de datos no persistidos.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        X-RateLimit-Scope:
          $ref: '#/components/headers/X-RateLimit-Scope'
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Segundos mínimos antes de reintentar.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Fallo sin SQL, stack ni secretos.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        X-RateLimit-Scope:
          $ref: '#/components/headers/X-RateLimit-Scope'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotModified:
      description: Política sin cambios; GET sin body.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        X-RateLimit-Scope:
          $ref: '#/components/headers/X-RateLimit-Scope'
        ETag:
          schema:
            type: string
            maxLength: 160
          description: Versión efectiva.
        Cache-Control:
          schema:
            const: private, no-cache
          description: Caché privada.
        Vary:
          schema:
            const: Authorization
          description: Separar credenciales.
