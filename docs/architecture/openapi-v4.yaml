          type: integer
          minimum: 1
        day:
          type: string
          format: date
        active_seconds:
          type: integer
          minimum: 0
          maximum: 86400
        idle_seconds:
          type: integer
          minimum: 0
          maximum: 86400
        call_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: >-
            Subconjunto de active_seconds con una aplicación de llamada en primer plano.
            Se reinicia con el día, a diferencia de K3, donde el contador de sesión
            arrastraba las llamadas de días anteriores hasta reiniciar el equipo.
        work_hours_active_seconds:
          type: integer
          minimum: 0
          maximum: 86400
        work_hours_idle_seconds:
          type: integer
          minimum: 0
          maximum: 86400
        lunch_active_seconds:
          type: integer
          minimum: 0
          maximum: 86400
        lunch_idle_seconds:
          type: integer
          minimum: 0
          maximum: 86400
        after_hours_active_seconds:
          type: integer
          minimum: 0
          maximum: 86400
        after_hours_idle_seconds:
          type: integer
          minimum: 0
          maximum: 86400
        first_activity_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: >-
            Primera actividad REAL observada en el día, no el primer envío. En K3
            first_event_at marcaba el primer flush HTTP, de modo que un equipo encendido
            a las 07:00 con trabajo desde las 09:00 registraba las 07:00.
        last_activity_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        sample_count:
          type: integer
          minimum: 0
          description: >-
            Muestras de inactividad realmente tomadas que respaldan estos contadores;
            indica la calidad del dato. NO equivale a samples_count de K3, que contaba
            envíos HTTP del día (~2.880 en una jornada) y no medía nada del usuario.
        utc_offset_minutes:
          type: integer
          minimum: -840
          maximum: 840
          description: Desfase local del equipo, para interpretar `day` sin ambigüedad.
      description: >-
        Contadores absolutos por device/día; upsert monotónico, no suma.
        El desglose horario (work_hours/lunch/after_hours) reproduce la categorización
        de `keeper_activity_day` de K3: sin él el panel solo puede mostrar un total y no
        puede distinguir actividad en horario, en almuerzo o fuera de jornada.
        Los campos del desglose son opcionales: ausentes significan DESCONOCIDO, no cero,
        para que un agente antiguo no falsee el reporte con ceros.
        `is_workday` no viaja aquí a propósito: el servidor lo deriva del horario y del
        calendario de festivos, que K3 no consultaba (usaba "no es sábado ni domingo").
