components:
  schemas:
    HardeningSettingsInput:
      type: object
      additionalProperties: false
      required:
      - admin_name
      - hardening_mode
      - deny_network_logon
      properties:
        admin_name: &id001
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^[^\x00-\x1f\x7f"/\\\[\]:;|=,+*?<>@]+$
          description: Nombre local Windows; no puede ser blanco ni terminar en punto.
        hardening_mode: &id002
          type: string
          enum:
          - auto
          - panel
        deny_network_logon: &id003
          type: boolean
          description: Aplicar SeDenyNetworkLogonRight a S-1-5-114; no al SID de la cuenta.
        shared_password:
          type: string
          minLength: 12
          maxLength: 128
          pattern: ^[^\x00-\x1f\x7f]+$
          writeOnly: true
          description: Obligatoria al configurar por primera vez. Omitir conserva la clave; nunca enviar la m?scara.
    HardeningSettings:
      type: object
      additionalProperties: false
      required:
      - tenant_id
      - admin_name
      - hardening_mode
      - deny_network_logon
      - shared_password
      - updated_by
      - updated_at
      properties:
        tenant_id: &id004
          type: string
          format: uuid
        admin_name: *id001
        hardening_mode: *id002
        deny_network_logon: *id003
        shared_password:
          anyOf:
          - type: string
            const: '********'
            description: M?scara fija, independiente de la longitud; null si no configurada.
          - type: 'null'
        updated_by:
          anyOf:
          - type: string
            format: uuid
            description: Principal de auditor?a del administrador.
          - type: 'null'
        updated_at:
          anyOf:
          - &id006
            type: string
            format: date-time
          - type: 'null'
    ClientHardeningSettings:
      type: object
      additionalProperties: false
      required:
      - admin_name
      - hardening_mode
      - deny_network_logon
      - shared_password
      properties:
        admin_name: *id001
        hardening_mode: *id002
        deny_network_logon: *id003
        shared_password:
          type: string
          minLength: 12
          maxLength: 128
          pattern: ^[^\x00-\x1f\x7f]+$
          readOnly: true
          description: Secreto; solo TLS, bearer y firma. No persistir en logs ni argumentos de procesos.
    HardeningPasswordReveal:
      type: object
      additionalProperties: false
      required:
      - shared_password
      properties:
        shared_password:
          type: string
          minLength: 12
          maxLength: 128
          pattern: ^[^\x00-\x1f\x7f]+$
          readOnly: true
    HardeningReport:
      type: object
      additionalProperties: false
      required:
      - state
      properties:
        state: &id005
          type: string
          enum:
          - none
          - pending
          - hardened
          - recovery_required
          - panel_wait
        last_step:
          anyOf:
          - type: string
            maxLength: 100
          - type: integer
            minimum: 0
            maximum: 100
          - type: 'null'
        detail:
          anyOf:
          - type: string
            maxLength: 1000
            description: Diagn?stico sanitizado del agente; nunca claves ni credenciales.
          - type: 'null'
    DeviceHardeningStatus:
      type: object
      additionalProperties: false
      required:
      - device_id
      - tenant_id
      - state
      - last_step
      - detail
      - hardened_at
      - reported_at
      properties:
        device_id: *id004
        tenant_id: *id004
        state: *id005
        last_step:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
        detail:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
        hardened_at:
          anyOf:
          - *id006
          - type: 'null'
        reported_at:
          anyOf:
          - *id006
          - type: 'null'
    HardeningCommandInput:
      type: object
      additionalProperties: false
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - harden
          - unharden
    HardeningCommandAccepted:
      type: object
      additionalProperties: false
      required:
      - command_id
      - device_id
      - action
      - status
      properties:
        command_id: *id004
        device_id: *id004
        action:
          type: string
          enum:
          - harden
          - unharden
        status:
          type: string
          const: pending
    HolidayInput:
      type: object
      additionalProperties: false
      required:
      - day
      - name
      - society_ids
      properties:
        day:
          type: string
          format: date
        name:
          type: string
          maxLength: 160
        society_ids:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
          maxItems: 100
    Holiday:
      type: object
      additionalProperties: false
      required:
      - id
      - day
      - name
      - society_ids
      properties:
        id:
          type: string
          format: uuid
        day:
          type: string
          format: date
        name:
          type: string
          maxLength: 160
        society_ids:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
          maxItems: 100
    HolidaySocietyInput:
      type: object
      additionalProperties: false
      required:
      - name
      - firm_id
      properties:
        name:
          type: string
          maxLength: 120
        firm_id:
          type: string
          format: uuid
    HolidaySociety:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - firm_id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        firm_id:
          type: string
          format: uuid
    SuspiciousAppInput:
      type: object
      additionalProperties: false
      required:
      - app_pattern
      - category
      - description
      - active
      properties:
        app_pattern:
          type: string
          maxLength: 190
          minLength: 1
        category:
          enum:
          - remote_desktop
          - foreign_vpn
          - foreign_workspace
          - vm
          type: string
        description:
          type: string
          maxLength: 255
        active:
          type: boolean
    SuspiciousApp:
      type: object
      additionalProperties: false
      required:
      - id
      - app_pattern
      - category
      - description
      - active
      properties:
        id:
          type: string
          format: uuid
        app_pattern:
          type: string
          maxLength: 190
          minLength: 1
        category:
          enum:
          - remote_desktop
          - foreign_vpn
          - foreign_workspace
          - vm
          type: string
        description:
          type: string
          maxLength: 255
        active:
          type: boolean
    ComplianceSignal:
      type: object
      additionalProperties: false
      required:
      - code
      - description
      properties:
        code:
          type: string
          maxLength: 40
        description:
          type: string
          maxLength: 500
    DualJobAlert:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - display_name
      - day
      - alert_type
      - severity
      - evidence
      - reviewed
      - notes
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
          maxLength: 190
        day:
          type: string
          format: date
        alert_type:
          type: string
          maxLength: 40
        severity:
          type: string
          enum:
          - low
          - medium
          - high
        evidence:
          type: string
          maxLength: 16000
        reviewed:
          type: boolean
        notes:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
    SuspiciousDetection:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - display_name
      - device_id
      - app_id
      - day
      - process_name
      - active_seconds
      - first_activity
      - last_activity
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
          maxLength: 190
        device_id:
          type: string
          format: uuid
        app_id:
          type: string
          format: uuid
        day:
          type: string
          format: date
        process_name:
          type: string
          maxLength: 160
        active_seconds:
          type: integer
          minimum: 0
        first_activity:
          type: string
          format: date-time
        last_activity:
          type: string
          format: date-time
    InstallCoverageInput:
      type: object
      additionalProperties: false
      required:
      - note_text
      - is_exempt
      properties:
        note_text:
          type: string
          maxLength: 4000
        is_exempt:
          type: boolean
    InstallCoverage:
      type: object
      additionalProperties: false
      required:
      - user_id
      - display_name
      - device_count
      - enrolled_count
      - last_seen_at
      - status
      - note_text
      - is_exempt
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
          maxLength: 190
        device_count:
          type: integer
          minimum: 0
        enrolled_count:
          type: integer
          minimum: 0
        last_seen_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        status:
          type: string
          enum:
          - missing
          - pending
          - stale
          - covered
          - exempt
        note_text:
          type: string
          maxLength: 4000
